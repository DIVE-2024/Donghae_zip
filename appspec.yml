version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/donghae_app
    overwrite: yes
file_exists_behavior: OVERWRITE  # ✅ 기존 파일이 존재하면 덮어쓰기

permissions:
  - object: /home/ec2-user/donghae_app
    pattern: "**"
    owner: ec2-user
    group: ec2-user
    mode: 755  # ✅ 모든 파일을 ec2-user가 접근할 수 있도록 설정

hooks:
  BeforeInstall:
    - location: scripts/clear_old_files.sh
      timeout: 300
      runas: root
    - location: scripts/unzip_and_setup.sh
      timeout: 300
      runas: root
    - location: scripts/ensure_permissions.sh
      timeout: 300
      runas: root  # ✅ root 권한으로 실행하여 chmod 오류 방지

  AfterInstall:
    - location: scripts/start_server.sh
      timeout: 300
      runas: ec2-user