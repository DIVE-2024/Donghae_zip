version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "===== Installing dependencies ====="
      - java -version
      - chmod +x gradlew || echo "Failed to set execute permissions!"
      - ./gradlew --version || echo "Gradle wrapper execution failed!"

  build:
    commands:
      - echo "===== Building the project ====="
      - |
        ./gradlew build -x test || \
        echo "Gradle build failed!"

      - echo "===== Moving JAR file to root for deployment ====="
      - cp build/libs/Donghae_zip-0.0.1-SNAPSHOT.jar . || echo "JAR move failed!"

      - echo "===== Creating Deployment ZIP (Fixed) ====="
      - |
        zip -r deployment-package.zip appspec.yml scripts Donghae_zip-0.0.1-SNAPSHOT.jar || echo "ZIP creation failed!"

      - echo "===== Checking Deployment Package ====="
      - |
        unzip -l deployment-package.zip || \
        echo "Deployment package is missing!"

  post_build:
    commands:
      - echo "===== Uploading to S3 ====="
      - |
        aws s3 cp deployment-package.zip s3://codepipeline-ap-northeast-2-551819632284/DonghaePipeline/DonghaeArt/deployment-package.zip --sse aws:kms || \
        echo "S3 upload failed!"

      - echo "===== Verifying Deployment Files in S3 ====="
      - |
        aws s3 ls s3://codepipeline-ap-northeast-2-551819632284/DonghaePipeline/DonghaeArt/ || \
        echo "S3 bucket check failed!"

artifacts:
  files:
    - deployment-package.zip  # ✅ ZIP 파일명을 정확히 지정하여 중첩 방지
  discard-paths: no  # ✅ ZIP 파일이 중첩되지 않도록 설정
