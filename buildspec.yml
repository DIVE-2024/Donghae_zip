version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo Installing dependencies...
  build:
    commands:
      - echo "Checking build files..."
      - ls -al build/libs/  # JAR 파일이 존재하는지 확인
      - mkdir -p deploy  # 배포용 디렉터리 생성
      - cp build/libs/Donghae_zip-0.0.1-SNAPSHOT.jar deploy/  # JAR 파일 복사
      - cp -r scripts deploy/  # 스크립트 폴더 복사
      - cp appspec.yml deploy/  # appspec.yml 복사
      - ls -al deploy/  # 복사된 파일 확인
      - cd deploy && zip -r ../deployment-package.zip .  # ZIP 파일을 deploy 폴더 기준으로 생성
      - cd .. && ls -al  # ZIP 파일이 루트 디렉터리에 생성되었는지 확인

artifacts:
  files:
    - '**/*.zip'  # 모든 ZIP 파일을 업로드하도록 설정
  discard-paths: no
  name: DonghaeArtifact
