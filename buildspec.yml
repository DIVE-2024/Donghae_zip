version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Installing dependencies..."
  build:
    commands:
      - echo "Building the project..."
      - chmod +x ./gradlew
      - ./gradlew build -x test  # 테스트 제외하고 빌드
      - cp build/libs/Donghae_zip-0.0.1-SNAPSHOT.jar .  # JAR 파일을 루트에 복사
      - cp -r scripts .  # scripts 폴더를 루트에 복사
      - cp appspec.yml .  # appspec.yml을 루트에 복사
      - zip -r deployment-package.zip *  # 모든 파일을 ZIP으로 압축

artifacts:
  files:
    - deployment-package.zip  # 최종 배포 파일 S3에 업로드
  discard-paths: no
  name: DonghaeArtifact  # CodeDeploy에서 사용할 S3 아티팩트 이름
